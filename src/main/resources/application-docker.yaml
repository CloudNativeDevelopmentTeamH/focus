quarkus:
  http:
    port: 8080

  datasource:
    jdbc:
      url: jdbc:postgresql://postgres:5432/focus

  grpc:
    clients:
      auth:
        host: auth
        port: 50051
      analytics:
        host: analytics
        port: 9090

focus:
  events:
    kafka:
      bootstrap-servers: ${FOCUS_EVENTS_KAFKA_BOOTSTRAP_SERVERS:redpanda:9092}
      topic: focus.events
