services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: focus
      POSTGRES_USER: focus
      POSTGRES_PASSWORD: focus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focus -d focus"]
      interval: 5s
      timeout: 5s
      retries: 10

  focus:
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8088:8088"
    environment:
      QUARKUS_PROFILE: docker
      FOCUS_EVENTS_KAFKA_BOOTSTRAP_SERVERS: host.docker.internal:19092
    restart: unless-stopped

volumes:
  postgres_data: