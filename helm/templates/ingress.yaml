{{- if .Values.focus.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{ .Values.focus.name }}-ingress"
  namespace: focus
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    {{- if .Values.focus.ingress.certificateArn }}
    alb.ingress.kubernetes.io/certificate-arn: "{{ .Values.focus.ingress.certificateArn }}"
    {{- end }}
spec:
  ingressClassName: {{ .Values.focus.ingress.className }}
  rules:
    - http:
        paths:
          - path: {{ .Values.focus.ingress.path }}
            pathType: {{ .Values.focus.ingress.pathType }}
            backend:
              service:
                name: "{{ .Values.focus.name }}-service"
                port:
                  number: {{ .Values.focus.service.port }}
{{- end }}